name: Build APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK and Accept Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-33" "build-tools;33.0.1"
          
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4'
        
      - name: Build Debug APK  # <-- CAMBIADO A DEBUG
        run: gradle assembleDebug  # <-- CAMBIADO A DEBUG
        
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug  # <-- CAMBIADO EL NOMBRE
          path: app/build/outputs/apk/debug/*.apk  # <-- RUTA A LA CARPETA DEBUG
