name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repo
        uses: actions/checkout@v4

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: SDK de Android
        uses: android-actions/setup-android@v3

      - name: Generar wrapper de Gradle
        run: gradle wrapper --gradle-version 8.7

      - name: Permiso de ejecución
        run: chmod +x gradlew

      - name: Compilar APK (debug, sin firma)
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Subir APK como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: ajedrez-stockfish-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
