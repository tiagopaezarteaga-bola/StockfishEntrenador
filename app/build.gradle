plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.ajedrez.stockfish'
    compileSdk 34

    defaultConfig {
        applicationId "com.ajedrez.stockfish"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            // El workflow de GitHub Actions compila esta variante (assembleDebug):
            // no necesita firma para poder instalarse manualmente.
        }
    }

    // El .js y el .wasm del motor son binarios grandes: que AAPT los guarde
    // "sin comprimir" dentro del APK (más simple y evita sorpresas al leerlos).
    androidResources {
        noCompress += ['wasm', 'js']
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = "17"
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.11.0'
    implementation 'androidx.appcompat:appcompat:1.7.0'
}
