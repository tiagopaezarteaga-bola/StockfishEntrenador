apply plugin: 'com.android.application'
apply plugin: 'com.chaquo.python'

android {
    namespace 'com.example.ajedrezapk'
    compileSdk 33  // Cambiado de 34 a 33

    defaultConfig {
        applicationId "com.example.ajedrezapk"
        minSdk 24
        targetSdk 33  // Cambiado de 34 a 33
        versionCode 1
        versionName "1.0"
        
        ndk {
            abiFilters "arm64-v8a", "x86_64", "armeabi-v7a", "x86"
        }
        
        python {
            version "3.11"
            buildPython "/usr/bin/python3"
        }
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
}
